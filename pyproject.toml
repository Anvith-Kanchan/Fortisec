[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fortisec"
version = "0.1.2"
description = "Lightweight security utilities for validation, hashes, entropy, redaction, headers, and safe paths."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Anvith Kanchan" }
]
keywords = [
  "api",
  "cybersecurity",
  "devsecops",
  "headers",
  "hashes",
  "jwt",
  "pentesting",
  "redaction",
  "security",
  "utilities",
  "validation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
fortisec = "fortisec.cli:main"

[project.optional-dependencies]
dev = [
  "black>=24.0,<25.0",
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/your-username/fortisec"
Issues = "https://github.com/your-username/fortisec/issues"
Repository = "https://github.com/your-username/fortisec"

[tool.hatch.build.targets.wheel]
packages = ["src/fortisec"]

[tool.pytest.ini_options]
addopts = "--cov=fortisec --cov-report=term-missing"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["fortisec"]

